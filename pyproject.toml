[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-exposure-analysis"
version = "0.1.0"
description = "Blockchain exposure and typology analysis on public / synthetic transfer data: taint propagation, hop distance, peeling chains."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ara Avetisyan" }]
dependencies = ["pandas>=2.0", "networkx>=3.0", "pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
crypto-exposure = "crypto_exposure.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
crypto_exposure = ["*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
